- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - libmunge-dev
      - munge
      - libssl-dev
      - libpam0g-dev
      - libreadline-dev
      - libncurses-dev
      - libhttp-parser-dev
      - libyaml-dev
      - libcurl4-openssl-dev
      - libjwt-dev
      - man2html
      - pkg-config
      - cmake
      - dpkg-dev
      - libjson-c-dev
      - libdbus-1-dev      # cgroup/v2
      - libhwloc-dev       # CPU topology detection
      - libmariadb-dev
     
      

    state: present
    update_cache: true

- name: Create slurm group
  ansible.builtin.group:
    name: "{{ slurm_group }}"
    gid: "{{ slurm_gid }}"
    system: true

- name: Create slurm user
  ansible.builtin.user:
    name: "{{ slurm_user }}"
    group: "{{ slurm_group }}"
    uid: "{{ slurm_uid }}"
    system: true
    shell: /sbin/nologin
    home: "{{ slurm_state_save_location }}"
    create_home: false

- name: Create Slurm state and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ slurm_user }}"
    group: "{{ slurm_group }}"
    mode: "0755"
  loop:
    - "{{ slurm_state_save_location }}"
    - "{{ slurm_log_dir }}"

- name: Download Slurm {{ slurm_version }} source
  ansible.builtin.get_url:
    url: "https://download.schedmd.com/slurm/slurm-{{ slurm_version }}.tar.bz2"
    dest: "/tmp/slurm-{{ slurm_version }}.tar.bz2"
    mode: "0644"

- name: Create Slurm build directory
  ansible.builtin.file:
    path: "{{ slurm_build_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Slurm config directory
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Extract Slurm source
  ansible.builtin.unarchive:
    src: "/tmp/slurm-{{ slurm_version }}.tar.bz2"
    dest: "{{ slurm_build_dir }}"
    remote_src: true
    creates: "{{ slurm_build_dir }}/slurm-{{ slurm_version }}/configure"

- name: Configure Slurm build
  ansible.builtin.command:
    cmd: "./configure {{ slurm_configure_opts | join(' ') }}"
    chdir: "{{ slurm_build_dir }}/slurm-{{ slurm_version }}"
    creates: "{{ slurm_build_dir }}/slurm-{{ slurm_version }}/config.status"

- name: Build and install Slurm
  ansible.builtin.command:
    cmd: "make -j{{ ansible_processor_vcpus }} install"
    chdir: "{{ slurm_build_dir }}/slurm-{{ slurm_version }}"
    creates: "{{ slurm_install_prefix }}/sbin/slurmctld"

- name: Refresh linker cache after install
  ansible.builtin.command: ldconfig

- name: Deploy slurm.conf
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/slurm.conf.j2"
    dest: /etc/slurm/slurm.conf
    owner: "{{ slurm_user }}"
    group: "{{ slurm_group }}"
    mode: "0644"
  notify: restart slurmctld

- name: Install slurmctld systemd unit
  ansible.builtin.copy:
    src: "{{ slurm_build_dir }}/slurm-{{ slurm_version }}/etc/slurmctld.service"
    dest: /etc/systemd/system/slurmctld.service
    remote_src: true
  notify: reload systemd

- name: Enable and start slurmctld
  ansible.builtin.systemd:
    name: slurmctld
    enabled: true
    state: started
    daemon_reload: true