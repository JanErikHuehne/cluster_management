- name: Install AD integration packages
  ansible.builtin.apt:
    name:
      - sssd-ad
      - sssd-tools
      - realmd
      - adcli
      - krb5-user
      - libpam-mkhomedir
      - oddjob
      - oddjob-mkhomedir
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Deploy krb5.conf
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"

- name: Check if already joined to AD
  ansible.builtin.command: realm list
  register: realm_status
  changed_when: false
  failed_when: false

- name: Join AD domain
  ansible.builtin.command:
    cmd: >
      realm join --user={{ ad_join_user }}
      --computer-name={{ sssd_sasl_authid | regex_replace('\$$', '') }}
      {{ sssd_ad_domain }}
    stdin: "{{ ad_join_password }}"
  when: sssd_ad_domain not in realm_status.stdout
  no_log: true

- name: Deploy sssd.conf
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart sssd

- name: Enable home directory creation on first login
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  changed_when: false

- name: Enable and start sssd
  ansible.builtin.systemd:
    name: sssd
    enabled: true
    state: started