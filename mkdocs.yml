site_name: Cluster Ansible Build 
repo_url: https://github.com/JanErikHuehne/cluster_management 
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Host Vars: hosts_vars/index.md
  - Test: test/index.md
  - Templates:
      - Overview: templ/index.md
      - slurm.conf.j2: templ/slurm_conf_j2.md